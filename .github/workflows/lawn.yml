# Mows the repository owner's graph every night and pushes the pictures to the
# `output` branch, where a README can point an <img> at them.
#
# You do not have to copy this by hand. On the site
# (https://evch1204.github.io/mow-your-commits/), type your username and press
# "add the workflow to GitHub": that opens GitHub's own new-file editor on your
# profile repo with the right version of this file already filled in, and you
# press GitHub's commit button. "run it once" and "open your README" are the
# other two steps.
#
# By hand: copy this into your own profile repo as .github/workflows/lawn.yml
# and change the first `uses:` to:   uses: evch1204/mow-your-commits@v1
# (then you do not need the checkout step either).
name: mow the lawn

on:
  schedule: [{ cron: '0 3 * * *' }]
  workflow_dispatch:
  push: { branches: [main] }

permissions: { contents: write }

jobs:
  mow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/lawn.svg?animate=1
            dist/lawn-dark.svg?theme=dark&animate=1

      - uses: crazy-max/ghaction-github-pages@v4
        with: { target_branch: output, build_dir: dist }
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
