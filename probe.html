<!doctype html><meta charset="utf-8"><title>probe</title>
<style>body{font:13px/1.45 monospace;background:#fff;color:#111;margin:8px;white-space:pre}
canvas{width:860px;height:250px;display:block;border:1px solid #ccc}</style>
<div id="stage" style="position:relative;width:860px"><canvas id="deep"></canvas><canvas id="flat"></canvas></div>
<div id="out">running…</div>
<script type="module">
import { createLawn, tick, resetLawn } from '/src/core/lawn.js';
import { Renderer3D } from '/src/render3d/index.js';
import { Renderer2D } from '/src/render2d/index.js';
const log = [];
const say = (s) => { log.push(s); document.getElementById('out').textContent = log.join('\n'); };
const deepCanvas = document.getElementById('deep');
const flatCanvas = document.getElementById('flat');
flatCanvas.style.height = '';
try {
  let lawn = createLawn(null, {});                 // rolling, 52 cols
  const d = new Renderer3D(deepCanvas, lawn);
  const f = new Renderer2D(flatCanvas, lawn);
  let t = 0;
  const frames = (n) => { for (let i = 0; i < n; i++) { t += 16.7; tick(lawn, { up: true }, 1/60); d.draw(t); f.draw(t); } };
  const stat = (tag) => {
    const r = d.renderer.info.render;
    say(`${tag}: cols=${lawn.cols} calls=${r.calls} tris=${r.triangles} progs=${d.renderer.info.programs.length}`
      + ` tiles=${d.tiles.count} grass=[${d.grass.map(g=>g.count)}] flowers=${d.flowers.count}`
      + ` signs=${d.signs.length} hills=${d.hills.length} trees=${d.trees.length} overFit=${d.overFit.toFixed(1)} overDist=${d.over.dist.toFixed(1)}`
      + ` clip3=${d.clippings.length} pop3=${d.popups.length} clip2=${f.clippings.length} pop2=${f.popups.length} weather2=${f.weather.length} cut2=${f.cutAt.size}`);
  };
  d.setCamera('chase'); frames(120); stat('chase 52');
  d.setCamera('overview'); frames(30); stat('overview 52');
  d.setCamera('chase'); frames(5);
  for (const y of [2024, 2028, 2025]) {
    lawn = createLawn(null, { year: y });
    d.setLawn(lawn); f.setLawn(lawn);
    frames(90); stat('after setLawn ' + y);
  }
  // mow a whole lawn with only the 2D view "active" to check the pool caps
  lawn = createLawn(null, {});
  d.setLawn(lawn); f.setLawn(lawn);
  for (let row = 0; row < 7; row++) {
    lawn.mower.z = row + 0.5; lawn.mower.x = -2; lawn.mower.angle = 0; lawn.mower.vel = 0;
    let g = 0;
    while (lawn.mower.x < lawn.cols + 1 && g++ < 20000) {
      const m = tick(lawn, { up: true }, 1/60);
      if (m.length) { d.onMowed(m); f.onMowed(m); }
    }
  }
  say(`full mow, no draws: clip3=${d.clippings.length} pop3=${d.popups.length} clip2=${f.clippings.length} pop2=${f.popups.length} cut3=${d.cutAt.size} cut2=${f.cutAt.size} anim=${d.anim.size} scene=${d.scene.children.length}`);
  frames(60); stat('after switching back');
  resetLawn(lawn); d.reset(); f.reset();
  frames(10); stat('after regrow');
  say('OK');
} catch (e) { say('THREW: ' + (e && e.stack || e)); }
</script>
